[project]
name = "omexplore"
version = "0.2.0"
description = "Opponent/teammate modeling via subgoal inference for team-based competitive exploration (CMAPF benchmark maps)"
readme = "README.md"
authors = [
    { name = "marcelpetran", email = "marcelpetran55@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "wandb>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omexplore*"]
